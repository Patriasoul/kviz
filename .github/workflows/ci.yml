name: PatriaSoul Quiz CI

on:
  push:
    branches: ["quiz-engine", "main"]
  pull_request:
    branches: ["quiz-engine", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate data and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate canonical question data
        id: generate
        run: npm run questions

      - name: Upload city audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patriasoul-city-question-audit
          path: src/data/cityQuestions.audit.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit generated question data
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "patriasoul-kviz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/questions.generated.js src/data/cityQuestions.generated.js src/data/cityQuestions.audit.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "data: import canonical PatriaSoul quiz questions"
          git push

      - name: Validate generated question files
        run: |
          test -s src/data/questions.generated.js
          test -s src/data/cityQuestions.generated.js
          grep -q "export const QUESTIONS" src/data/questions.generated.js
          grep -q "export const CITY_QUESTIONS" src/data/cityQuestions.generated.js

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: patriasoul-kviz-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
