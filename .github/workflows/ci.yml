name: PatriaSoul Quiz CI

on:
  push:
    branches: ["quiz-engine", "main"]
  pull_request:
    branches: ["quiz-engine", "main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PatriaSoul Quiz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Import verified city questions
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run import:cities

      - name: Generate general question data
        run: npm run questions

      - name: Commit generated general question data
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "patriasoul-kviz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/questions.generated.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "data: import canonical PatriaSoul quiz questions"
          git push

      - name: Validate generated question file
        run: |
          test -s src/data/questions.generated.js
          grep -q "export const QUESTIONS" src/data/questions.generated.js

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: patriasoul-kviz-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
