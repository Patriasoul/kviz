<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#193452" />
    <meta name="description" content="PatriaSoul — Hrvatski kviz, znanje, povijest i baština Hrvatske." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PatriaSoul" />
    <link rel="manifest" href="/kviz/manifest.webmanifest" />
    <link rel="icon" href="https://raw.githubusercontent.com/Patriasoul/patriasoul/main/images/file_0000000082ec81f4a6fc17bdbd959622_114540.png" type="image/png" />
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Patriasoul/patriasoul/main/images/file_0000000082ec81f4a6fc17bdbd959622_114540.png" />
    <title>PatriaSoul — Hrvatski kviz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      // Jednokratno uklanjanje starog PWA cachea. Ako je stari SW još
      // preuzeo ovu stranicu, napravi reload nakon unregistera kako bi
      // aktualni GitHub Pages build sigurno preuzeo svježe assete.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            const keys = window.caches ? await caches.keys() : [];
            const hadOldCache = keys.some((key) => key.startsWith("patriasoul-kviz-"));
            if (registrations.length || hadOldCache) {
              await Promise.all(registrations.map((registration) => registration.unregister()));
              if (window.caches) {
                await Promise.all(
                  keys
                    .filter((key) => key.startsWith("patriasoul-kviz-"))
                    .map((key) => caches.delete(key))
                );
              }
              if (!sessionStorage.getItem("patriasoul-sw-cleaned")) {
                sessionStorage.setItem("patriasoul-sw-cleaned", "1");
                window.location.reload();
                return;
              }
            }
          } catch (_) {
            // PWA cleanup ne smije blokirati učitavanje aplikacije.
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
